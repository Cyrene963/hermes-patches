# Memory Write Pipeline Configuration
# Auto-write is ON by default, gated by an LLM fact classifier on the FULL user
# message + readback + private-namespace + circuit-breaker (fail-closed).
# EARNED BY DATA (2026-06-12): on a 20-case mixed set the classifier scored
# precision 1.000 (8/8 durable verdicts correct, 0 false positives; all 10 junk
# rejected) and 0/16 false positives on real shadow messages. The earlier 0.125
# was a measurement artifact of classifying truncated fragments, not full messages.
# To hold writes again, set llm_classifier:false.

memory_write:
  # Mode: shadow | limited_auto | full_auto
  mode: limited_auto

  # An LLM must confirm each candidate is a durable fact (on the full user message)
  # before auto-write. require_llm_classifier wires the gate; llm_classifier enables
  # the call. Together with readback they make on-by-default safe (precision 1.0).
  require_llm_classifier: true
  llm_classifier: true

  # Subject routing: a durable fact ABOUT another person is never auto-written into
  # the speaker's namespace (prevents one user's private memory filling up with a
  # contact's profile). false = such facts go to review. true = if the subject maps
  # to a known user in memory_identity.local.yaml `user_registry`, auto-write into
  # THAT user's namespace; unregistered subjects still go to review.
  subject_auto_route: false

  # Importance floor (the LLM classifier is the real precision gate).
  auto_write_threshold: 0.85

  # Types allowed for automatic writing when limited_auto is enabled.
  # These are explicit, user-originated, high-confidence digital-stand-in signals.
  # Risky/uncertain/project/conflicting items go to clarification-on-use instead
  # of low-ROI batch WebUI review.
  allowed_auto_types:
    - explicit_correction
    - explicit_preference
    - target_function
    - procedural_memory
    - decision
    - user_fact

  # Types that always require review
  always_review_types:
    - project_fact
    - inferred_preference
    - sensitive_rule
    - hindsight_import
    - low_confidence_fact

  # Never auto-write to core namespace
  never_auto_write_to_core: true

  # MEMORY.md size limit
  memory_md_max_bytes: 5000

  # Shadow mode settings
  shadow:
    log_dir: ~/.hermes/logs/shadow_writes
    max_entries_per_day: 1000
    enable_readback_dryrun: true

  # Quality thresholds to pass shadow mode
  quality_thresholds:
    precision_min: 0.95
    important_fact_recall_min: 0.85
    wrong_store_rate_max: 0.02
    wrong_path_rate_max: 0.05
    namespace_risk_count_max: 0
    memory_md_overuse_count_max: 0
