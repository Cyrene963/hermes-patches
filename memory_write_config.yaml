# Memory Write Pipeline Configuration
# Auto-write stays OFF until the LLM fact classifier reaches >=0.95 precision.
# Measured 2026-06-12 on real shadow candidates: precision 0.125 (1 good of 8
# "durable" verdicts) — the upstream heuristic feeds truncated fragments the
# classifier can't reliably judge. Fix: run the LLM classifier UPSTREAM on the
# full user message (detect+extract in one step), then re-measure. Flip
# llm_classifier:true only after a fair measurement clears 0.95.

memory_write:
  # Mode: shadow | limited_auto | full_auto
  mode: limited_auto

  # An LLM must confirm each candidate is a durable fact before auto-write.
  # require_llm_classifier keeps the gate wired; llm_classifier=false disables the
  # actual classifier call so auto-write is held (fail-closed) until precision is earned.
  require_llm_classifier: true
  llm_classifier: false

  # Importance floor (the LLM classifier is the real precision gate when enabled).
  auto_write_threshold: 0.85

  # Types allowed for automatic writing when limited_auto is enabled.
  # These are explicit, user-originated, high-confidence digital-stand-in signals.
  # Risky/uncertain/project/conflicting items go to clarification-on-use instead
  # of low-ROI batch WebUI review.
  allowed_auto_types:
    - explicit_correction
    - explicit_preference
    - target_function
    - procedural_memory
    - decision
    - user_fact

  # Types that always require review
  always_review_types:
    - project_fact
    - inferred_preference
    - sensitive_rule
    - hindsight_import
    - low_confidence_fact

  # Never auto-write to core namespace
  never_auto_write_to_core: true

  # MEMORY.md size limit
  memory_md_max_bytes: 5000

  # Shadow mode settings
  shadow:
    log_dir: ~/.hermes/logs/shadow_writes
    max_entries_per_day: 1000
    enable_readback_dryrun: true

  # Quality thresholds to pass shadow mode
  quality_thresholds:
    precision_min: 0.95
    important_fact_recall_min: 0.85
    wrong_store_rate_max: 0.02
    wrong_path_rate_max: 0.05
    namespace_risk_count_max: 0
    memory_md_overuse_count_max: 0
