# Memory Write Pipeline Configuration
# Auto-write is ON by default (limited_auto) but gated by an LLM fact classifier
# (require_llm_classifier) + readback verification, so it only writes durable,
# user-originated facts and is FAIL-CLOSED when the LLM is unreachable (writes
# nothing rather than polluting — the lesson from the 2026-05-25 incident).

memory_write:
  # Mode: shadow | limited_auto | full_auto
  mode: limited_auto

  # An LLM must confirm each candidate is a durable fact before auto-write.
  # This is the precision gate that makes "on by default" safe. Set false to
  # fall back to shadow/review only.
  require_llm_classifier: true
  llm_classifier: true

  # Importance floor (the LLM classifier is the real precision gate now).
  auto_write_threshold: 0.85

  # Types allowed for automatic writing when limited_auto is enabled.
  # These are explicit, user-originated, high-confidence digital-stand-in signals.
  # Risky/uncertain/project/conflicting items go to clarification-on-use instead
  # of low-ROI batch WebUI review.
  allowed_auto_types:
    - explicit_correction
    - explicit_preference
    - target_function
    - procedural_memory
    - decision
    - user_fact

  # Types that always require review
  always_review_types:
    - project_fact
    - inferred_preference
    - sensitive_rule
    - hindsight_import
    - low_confidence_fact

  # Never auto-write to core namespace
  never_auto_write_to_core: true

  # MEMORY.md size limit
  memory_md_max_bytes: 5000

  # Shadow mode settings
  shadow:
    log_dir: ~/.hermes/logs/shadow_writes
    max_entries_per_day: 1000
    enable_readback_dryrun: true

  # Quality thresholds to pass shadow mode
  quality_thresholds:
    precision_min: 0.95
    important_fact_recall_min: 0.85
    wrong_store_rate_max: 0.02
    wrong_path_rate_max: 0.05
    namespace_risk_count_max: 0
    memory_md_overuse_count_max: 0
